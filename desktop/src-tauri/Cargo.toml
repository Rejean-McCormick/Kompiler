[package]
name = "kompiler-desktop"
version = "0.8.0-alpha.1"
description = "Kompiler local context compiler desktop shell"
authors = ["Kompiler contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
