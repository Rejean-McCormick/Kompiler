[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kompiler"
version = "0.8.0-alpha.1"
description = "Local-first structured context compiler for LLMs and Kristal knowledge bases"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Kompiler contributors"}]
dependencies = [
  "pydantic>=2.8,<3",
  "jsonschema>=4.23,<5",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
duckdb = ["duckdb>=1.1,<2"]
canonical = ["rfc8785>=0.1.4,<1"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "hypothesis>=6.112,<7",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "pyright>=1.1.380,<2",
]
all = ["kompiler[api,duckdb,canonical,dev]"]

[project.scripts]
kompiler = "kompiler.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kompiler"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src"]
